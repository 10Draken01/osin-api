spring.application.name=osinapi

# Lee el archivo .env de la raiz del proyecto si existe (copia de .env.example)
spring.config.import=optional:file:.env[.properties]

server.forward-headers-strategy=framework
server.port=${PORT:8080}

# Oracle (valores por defecto para desarrollo local, se cambian con variables de entorno o .env)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:osin}
spring.datasource.password=${DB_PASS:osin}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Solamente activar si se requiere usar H2 para pruebas, de lo contrario desactivarlo
# Si se decide activar comentar las propiedades de Oracle y descomentar las de H2
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#
## H2 EN MEMORIA
#spring.datasource.url=jdbc:h2:mem:osinapiDb;MODE=Oracle
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=osin
#spring.datasource.password=osin
#spring.jpa.hibernate.ddl-auto=update

# ddl -> data definition lenguage
# para definir como es el comportamiento
# create, create_drop, update, validate, none
# El esquema lo crean los scripts de database/oracle, Hibernate solo valida que coincida con las entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Al listar pedidos carga las partidas de varios pedidos en una sola consulta (evita una consulta por pedido)
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Formato del JSON paginado: { content: [...], page: { size, number, totalElements, totalPages } }
spring.data.web.pageable.serialization-mode=via-dto

# Origenes permitidos para CORS, el frontend Angular corre en el puerto 4200
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.config-url=../v3/api-docs/swagger-config
springdoc.swagger-ui.url=../v3/api-docs
