spring.application.name=osinapi

server.foward-headers-strategy=framework

server.port=${PORT}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Solamente activar si se requiere usar H2 para pruebas, de lo contrario desactivarlo
# Si se decide activar comentar las propiedades de Oracle y descomentar las de H2
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#
